# Run this command to start the database:
# docker compose up
services:
  api:
    build: .
    container_name: chatnary-api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      - db
    restart: always

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: api
      POSTGRES_USER: ChatnarySYS
      POSTGRES_PASSWORD: 123123
    ports:
      - "5432:5432"
    restart: always
